<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128">
  <script xmlns=""/>
  <!-- Modern flat favicon: blue outer circle, soft-yellow inner circle, green plus -->
  <defs>
    <!-- Gradiente original do círculo interno -->
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1E88E5"/>
      <stop offset="1" stop-color="#1565C0"/>
    </linearGradient>

    <!-- NOVO: Gradiente Verde para o sinal de mais -->
    <linearGradient id="gradienteVerde" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#388E3C"/>
        <stop offset="100%" stop-color="#81C784"/>
    </linearGradient>

  </defs>
  <!-- Outer circle back to blue -->
  <circle cx="32" cy="32" r="32" fill="#FFD200"/>
  <!-- Central circle slightly large and soft yellow -->
  <circle xmlns="http://www.w3.org/2000/svg" cx="32" cy="32" r="26" fill="#FFEDC0"/>
  <circle xmlns="http://www.w3.org/2000/svg" cx="32" cy="32" r="22" fill="url(#bg)"/>

  <!-- Stylized E (white for contrast) -->
  <path d="M22 20 H42 V24 H28 V30 H39 V34 H28 V40 H42 V44 H22 Z" fill="#FFFFFF"/>
  
  <!-- Plus sign using a green gradient now -->
  <!-- AQUI ESTÁ A MUDANÇA: fill="url(#gradienteVerde)" -->
  <g fill="url(#gradienteVerde)">
    <rect x="47" y="-8" width="5" height="25" rx="1"/>
    <rect x="39" y="6" width="20" height="5" rx="1"/>
  </g>
  <title>Educa+ Curionópolis</title>
</svg>
