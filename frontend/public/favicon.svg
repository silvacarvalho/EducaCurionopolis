<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 768" width="768" height="768" preserveAspectRatio="xMidYMid meet">
  
  <!-- 
    ╔═══════════════════════════════════════════════════════════════════╗
    ║  VARIÁVEIS DE AJUSTE - ALTERE AQUI PARA REDIMENSIONAR A LOGO     ║
    ╠═══════════════════════════════════════════════════════════════════╣
    ║                                                                    ║
    ║  escala: Tamanho da logo (1.0 = original, 2.0 = dobro)          ║
    ║            Valores recomendados: 1.0 a 2.5                        ║
    ║                                                                    ║
    ║  offset-x: Deslocamento horizontal (valores negativos)          ║
    ║              Ajuste para centralizar horizontalmente              ║
    ║                                                                    ║
    ║  offset-y: Deslocamento vertical (valores negativos)            ║
    ║              Ajuste para centralizar verticalmente                ║
    ║                                                                    ║
    ║  margem: Espaço de respiro nas bordas (0 a 50)                 ║
    ║            0 = sem margem, 50 = margem máxima                     ║
    ║                                                                    ║
    ╚═══════════════════════════════════════════════════════════════════╝
  -->
  
  <defs>
    <style>
      :root {
        /* ═══ VARIÁVEIS PRINCIPAIS - AJUSTE AQUI ═══ */
        --escala: 1.52;        /* Escala da logo: 1.0 a 2.5 */
        --offset-x: 0;      /* Posição horizontal: -250 a -100 */
        --offset-y: 5.2;      /* Posição vertical: -150 a -50 */
        --margem: 0;           /* Margem extra: 0 a 50 */
        
        /* ═══ CÁLCULOS AUTOMÁTICOS - NÃO ALTERE ═══ */
        --ajuste-x: calc(var(--offset-x) + var(--margem));
        --ajuste-y: calc(var(--offset-y) + var(--margem));
        --escala-final: calc(var(--escala) - (var(--margem) * 0.002));
      }
      
      /* Grupo principal com transformações */
      .logo-group {
        transform: scale(var(--escala-final)) 
                   translate(calc(var(--ajuste-x) * 1px), 
                            calc(var(--ajuste-y) * 1px));
        transform-origin: center center;
      }
    </style>
  </defs>
